<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Schulnotizen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Menü">☰</button>
    <div id="notebookTitle">–</div>
    <div class="spacer"></div>
    <select id="bgSelect" title="Seitenhintergrund">
      <option value="lined">Linien</option>
      <option value="grid">Kariert</option>
      <option value="dot">Punktraster</option>
      <option value="blank">Leer</option>
    </select>
    <button id="exportBtn" class="icon-btn" title="Seite als Bild exportieren">⤓</button>
  </header>

  <div id="toolbar">
    <div id="toolButtons">
      <button class="tool-btn active" data-tool="fountain" title="Füller">🖋️</button>
      <button class="tool-btn" data-tool="ballpoint" title="Kugelschreiber">🖊️</button>
      <button class="tool-btn" data-tool="pencil" title="Bleistift">✏️</button>
      <button class="tool-btn" data-tool="marker" title="Marker">🖍️</button>
      <button class="tool-btn" data-tool="eraser" title="Radiergummi">🩹</button>
    </div>
    <input type="color" id="colorPicker" value="#1c2b4a" title="Farbe wählen">
    <div id="quickColors">
      <button class="swatch active" data-color="#1c2b4a" style="background:#1c2b4a"></button>
      <button class="swatch" data-color="#111111" style="background:#111111"></button>
      <button class="swatch" data-color="#c62828" style="background:#c62828"></button>
      <button class="swatch" data-color="#e2711d" style="background:#e2711d"></button>
      <button class="swatch" data-color="#f4c430" style="background:#f4c430"></button>
      <button class="swatch" data-color="#2e7d32" style="background:#2e7d32"></button>
      <button class="swatch" data-color="#1565c0" style="background:#1565c0"></button>
      <button class="swatch" data-color="#6a3fa0" style="background:#6a3fa0"></button>
    </div>
    <input type="range" id="widthSlider" min="1" max="7" step="0.2" value="2.6" title="Stiftstärke">
    <button id="pencilOnlyBtn" class="icon-btn" title="Nur mit Apple Pencil zeichnen (Finger/Maus zum Zeichnen sperren)">✒️ Nur Pencil</button>
    <button id="imageBtn" class="icon-btn" title="Bild oder Scan einfügen">🖼️ Bild</button>
    <input type="file" id="imageInput" accept="image/*" hidden>
    <div class="spacer"></div>
    <button id="undoBtn" class="icon-btn" title="Rückgängig">↩︎</button>
    <button id="redoBtn" class="icon-btn" title="Wiederholen">↪︎</button>
    <button id="clearBtn" class="icon-btn" title="Seite leeren">🗑</button>
  </div>

  <div id="pageStrip">
    <button id="prevPageBtn" class="icon-btn">‹</button>
    <div id="pageThumbs"></div>
    <button id="addPageBtn" class="icon-btn" title="Neue Seite">+ Seite</button>
    <button id="delPageBtn" class="icon-btn" title="Seite löschen">🗑︎</button>
    <button id="nextPageBtn" class="icon-btn">›</button>
  </div>

  <div id="canvasWrap">
    <canvas id="bgBoard"></canvas>
    <canvas id="board"></canvas>
    <div id="status"></div>
    <div id="emptyState" hidden>Kein Notizbuch geöffnet – wähle eins im Menü ☰</div>
  </div>

  <div id="sidebarBackdrop" hidden></div>
  <aside id="sidebar" hidden>
    <div class="sidebar-header">
      <h2>Notizbücher</h2>
      <button id="closeSidebarBtn" class="icon-btn">✕</button>
    </div>
    <div id="folderTree"></div>
    <div class="sidebar-actions">
      <button id="newFolderBtn">📁 Neuer Ordner</button>
      <button id="newNotebookBtn">📓 Neues Notizbuch</button>
    </div>
  </aside>

</div>
<script src="app.js"></script>
</body>
</html>
